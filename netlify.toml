[build]
  base    = "web"
  command = "npm run build"
  publish = "dist"
  # Always build (default skips builds when nothing changed inside base dir)
  ignore  = "exit 1"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for any path
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
